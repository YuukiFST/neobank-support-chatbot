[project]
name = "neobank-support"
version = "0.1.0"
description = "NeoBank AI Support Chatbot — portfolio project"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sse-starlette>=2,<3",
    # Data / DB
    "sqlalchemy[asyncio]>=2,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "redis[hiredis]>=5,<6",
    "chromadb>=0.6,<1",
    # LLM / AI
    "litellm>=1.52,<2",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "langchain-ollama>=0.2,<1",
    "langchain-community>=0.3,<1",
    "sentence-transformers>=3,<4",
    # Observability
    "langfuse>=2,<3",
    "prometheus-client>=0.21,<1",
    # Utilities
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.28,<1",
    "structlog>=24,<25",
    "python-dotenv>=1,<2",
    "celery[redis]>=5,<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "pre-commit>=4,<5",
    "httpx",
]
streamlit = [
    "streamlit>=1.40,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["services", "shared"]
omit = ["*/tests/*", "*/migrations/*"]
