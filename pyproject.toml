[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neobank-support"
version = "0.1.0"
description = "NeoBank AI Support Chatbot — portfolio project"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sse-starlette>=2,<3",
    # Data / DB
    "sqlalchemy[asyncio]>=2,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "redis[hiredis]>=5,<6",
    "chromadb>=0.6,<1",
    # LLM / AI
    "litellm>=1.52,<2",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "langchain-ollama>=0.2,<1",
    "langchain-community>=0.3,<1",
    "sentence-transformers>=3,<4",
    # Observability
    "langfuse>=2,<3",
    "prometheus-client>=0.21,<1",
    # Utilities
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.28,<1",
    "structlog>=24,<25",
    "python-dotenv>=1,<2",
    "celery[redis]>=5,<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "pre-commit>=4,<5",
    "httpx",
]
streamlit = [
    "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
include = ["shared*", "services*"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Ruff 0.16 formats Python code blocks inside Markdown. The snippets in plans/ and .scratch/
# are quoted evidence with the indentation they have in the source file — reformatting them
# corrupts the citation.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# agent.py holds the system prompts as triple-quoted literals. Re-wrapping a line there
# inserts a newline into the text sent to the model, which changes behaviour — and these
# prompts are the object under study. A `# noqa` cannot help: inside a triple-quoted
# string the comment would become part of the prompt.
"services/agent_api/application/agent.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm.*", "langgraph.*", "chromadb.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["services", "shared"]
omit = ["*/tests/*", "*/migrations/*"]
